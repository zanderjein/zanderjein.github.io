# Refreshes the JSON the site reads (data/*.json) and republishes the site.
#
# Runs at 06:00 and 18:00 UTC, and on demand from the Actions tab.
#
# Why the explicit rebuild step: GitHub does not start a Pages build for commits
# pushed with the workflow's GITHUB_TOKEN, so without it the refreshed data would
# sit in the repo while the live site stayed stale. `pages: write` lets the
# workflow request that build itself — no personal access token needed.

name: Refresh data

on:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:

permissions:
  contents: write   # commit the refreshed JSON
  pages: write      # request a Pages build after committing

# never let two refreshes run at once: they would race each other's pushes, and
# both would spend the same single-use Strava or WHOOP refresh token
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Each integration runs on its own and may fail without stopping the rest.
      # A failed script keeps its previous JSON, so the site never goes blank.
      - name: Goodreads
        id: goodreads
        continue-on-error: true
        run: node scripts/fetch-goodreads.js

      # Skips cleanly until the three STRAVA_* secrets exist.
      - name: Strava
        id: strava
        continue-on-error: true
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          STRAVA_REFRESH_TOKEN_OUT: ${{ runner.temp }}/strava-refresh-token
        run: node scripts/fetch-strava.js

      # Strava rotates refresh tokens and the old one stops working at once, so a
      # new one has to go back into the secret — even if the Strava step failed
      # after receiving it. GITHUB_TOKEN can't write secrets, hence the separate
      # fine-grained token.
      - name: Save rotated Strava token
        id: strava_token
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SECRETS_WRITE_TOKEN }}
          TOKEN_FILE: ${{ runner.temp }}/strava-refresh-token
        run: |
          if [ ! -s "$TOKEN_FILE" ]; then
            echo "No new Strava token to save."
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "The SECRETS_WRITE_TOKEN secret is missing, so the new token could not be saved."
            exit 1
          fi
          gh secret set STRAVA_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < "$TOKEN_FILE"
          rm -f "$TOKEN_FILE"
          echo "Saved the new Strava refresh token."

      # WHOOP spends its refresh token on every run. Before doing that, prove this
      # run can save the replacement: write a harmless canary secret with the same
      # token the save step uses. If that fails, WHOOP is skipped and its current
      # token stays valid instead of being burned.
      - name: Check secrets can be saved
        id: can_save
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SECRETS_WRITE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "The SECRETS_WRITE_TOKEN secret is missing."
            exit 1
          fi
          date -u +%Y-%m-%dT%H:%M:%SZ | gh secret set TOKEN_SAVE_CHECK --repo "$GITHUB_REPOSITORY"
          echo "Secrets can be saved."

      # Skips cleanly until the three WHOOP_* secrets exist.
      - name: WHOOP
        id: whoop
        if: steps.can_save.outcome == 'success'
        continue-on-error: true
        env:
          WHOOP_CLIENT_ID: ${{ secrets.WHOOP_CLIENT_ID }}
          WHOOP_CLIENT_SECRET: ${{ secrets.WHOOP_CLIENT_SECRET }}
          WHOOP_REFRESH_TOKEN: ${{ secrets.WHOOP_REFRESH_TOKEN }}
          WHOOP_REFRESH_TOKEN_OUT: ${{ runner.temp }}/whoop-refresh-token
        run: node scripts/fetch-whoop.js

      # Runs even if the WHOOP step failed after receiving its new token.
      - name: Save rotated WHOOP token
        id: whoop_token
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SECRETS_WRITE_TOKEN }}
          TOKEN_FILE: ${{ runner.temp }}/whoop-refresh-token
        run: |
          if [ ! -s "$TOKEN_FILE" ]; then
            echo "No new WHOOP token to save."
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "The SECRETS_WRITE_TOKEN secret is missing, so the new token could not be saved."
            exit 1
          fi
          gh secret set WHOOP_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < "$TOKEN_FILE"
          rm -f "$TOKEN_FILE"
          echo "Saved the new WHOOP refresh token."

      - name: Commit changed data
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nothing changed — no commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: refresh data [skip ci]"
          # pick up anything pushed while this job was running
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild the live site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"

      # Runs last, so data from integrations that worked is still committed,
      # but the run shows red so a broken integration doesn't fail silently.
      - name: Report failed integrations
        if: >-
          always() && (
          steps.goodreads.outcome == 'failure' ||
          steps.strava.outcome == 'failure' ||
          steps.strava_token.outcome == 'failure' ||
          steps.can_save.outcome == 'failure' ||
          steps.whoop.outcome == 'failure' ||
          steps.whoop_token.outcome == 'failure' )
        env:
          GOODREADS: ${{ steps.goodreads.outcome }}
          STRAVA: ${{ steps.strava.outcome }}
          STRAVA_TOKEN: ${{ steps.strava_token.outcome }}
          CAN_SAVE: ${{ steps.can_save.outcome }}
          WHOOP: ${{ steps.whoop.outcome }}
          WHOOP_TOKEN: ${{ steps.whoop_token.outcome }}
        run: |
          if [ "$CAN_SAVE" = failure ]; then
            echo "::error title=Secrets can't be saved::WHOOP was skipped to protect its token. SECRETS_WRITE_TOKEN may have expired or lost its Secrets permission."
          fi
          if [ "$WHOOP" = failure ]; then
            echo "::error title=WHOOP refresh failed::The previous whoop.json was kept. Open the WHOOP step for the reason."
          fi
          if [ "$WHOOP_TOKEN" = failure ]; then
            echo "::error title=WHOOP token not saved::The next WHOOP refresh will be rejected. Run ~/whoop-token.sh again."
          fi
          if [ "$GOODREADS" = failure ]; then
            echo "::error title=Goodreads refresh failed::The previous books.json was kept. Open the Goodreads step for the reason."
          fi
          if [ "$STRAVA" = failure ]; then
            echo "::error title=Strava refresh failed::The previous strava.json was kept. Open the Strava step for the reason."
          fi
          if [ "$STRAVA_TOKEN" = failure ]; then
            echo "::error title=Strava token not saved::The next Strava refresh will be rejected. Open the 'Save rotated Strava token' step."
          fi
          exit 1
